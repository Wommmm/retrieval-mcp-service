name: Retrieval service checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q tests/test_contract_and_service.py tests/test_mcp_transport.py tests/test_eval.py
      - run: python -m pip wheel --no-deps . -w dist
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release and scan history
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location --max-time 30 "$release/gitleaks_${version}_checksums.txt" --output checksums.txt
          awk -v archive="$archive" '$2 == archive {print}' checksums.txt > expected.txt
          test -s expected.txt
          sha256sum --check expected.txt
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact=100 --no-banner "$GITHUB_WORKSPACE"

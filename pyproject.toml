[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-retrieval-mcp"
version = "0.1.0"
description = "Retrieval-only service with HTTP/MCP contracts and bounded execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2", "pydantic==2.12.5", "mcp==1.25.0",
  "uvicorn==0.40.0", "httpx==0.28.1", "python-dotenv==1.2.1",
]

[project.optional-dependencies]
live = [
  "langgraph==1.0.5", "langgraph-prebuilt==1.0.5", "langchain-openai==1.1.7", "pymilvus[model]==2.6.6",
  "FlagEmbedding==1.4.2", "neo4j==6.3.1", "openai-agents==0.12.5",
]
agent = ["langgraph==1.0.5", "langgraph-prebuilt==1.0.5", "langchain-openai==1.1.7"]
test = ["pytest==9.1.1"]

[project.scripts]
retrieval-mcp = "retrieval_mcp.__main__:main"
retrieval-client = "retrieval_mcp.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"retrieval_mcp.vendor" = ["SOURCE.md", "source-manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
